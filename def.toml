# ============================================================
# RoleType - 角色类型定义
# value: 枚举值 (uint8_t)
# name: 中文名称（用于生成注释）
# ============================================================
[RoleType]
None = { value = 0, name = "无" }
CarryTypeA = { value = 1, name = "Ⅰ 类输出" }
CarryTypeB = { value = 2, name = "Ⅱ 类输出" }
